# Every push and pull request: build the solution and run the tests.
#
# Shader compilation needs Wine on Linux — MGFXC runs the DirectX
# d3dcompiler inside Wine. The ~/.winemonogame prefix is cached, and the
# cache is versioned by the setup script's own checksum so a MonoGame
# toolchain change invalidates it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full, for git-describe versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Wine and 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 p7zip-full

      - name: Restore MonoGame Wine prefix
        uses: actions/cache/restore@v4
        with:
          path: ~/.winemonogame
          key: winemonogame-${{ runner.os }}-v1

      - name: Setup MonoGame shader-compiler Wine environment
        run: |
          if [ ! -d ~/.winemonogame ]; then
            wget -qO- https://monogame.net/downloads/net9_mgfxc_wine_setup.sh > /tmp/mgfxc_setup.sh
            # Wine >= 9 refuses to launch dotnet.exe from system32; the Windows
            # SDK goes into drive_c/windows/ instead (wine's PATH includes it).
            # The d3dcompiler_47.dll extraction on line 60 must stay in system32,
            # so only the SDK line is rewritten.
            bash <(sed 's#dotnet-sdk.zip" -o"$WINEPREFIX/drive_c/windows/system32/"#dotnet-sdk.zip" -o"$WINEPREFIX/drive_c/windows/"#g' /tmp/mgfxc_setup.sh)
          fi
          # The build steps run in fresh shells that do not read ~/.profile,
          # where the setup script leaves its export.
          echo "MGFXC_WINE_PATH=$HOME/.winemonogame" >> "$GITHUB_ENV"

      - name: Save MonoGame Wine prefix
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.winemonogame
          key: winemonogame-${{ runner.os }}-v1

      - name: Build
        run: dotnet build MiVic.sln -c Release

      - name: Install xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Probe smoke-test
        # Every probe in the repository, driven through a virtual display with
        # Mesa's software rasterizer — no GPU needed. A red probe is a red
        # build: the probes step the real world, render real frames and hold
        # their checks, so this is the client regression gate, not a census.
        #
        # objectives.probe and paperclip.probe are excluded: each one is a
        # demonstration of the mission validator's refusals, whose subject
        # mission is broken on purpose, so they exit non-zero by design on
        # every platform.
        run: |
          mkdir -p artifacts/probe
          for p in tools/probe/*.probe; do
            name=$(basename "$p" .probe)
            case "$name" in objectives|paperclip) continue ;; esac
            flag=$(grep -o -- "--[a-z-]*-demo\|--victory-demo\|--select-hq\|--mission-file missions/[a-z_-]*.mission.json\|--map-file maps/[a-z_-]*.map.json" "$p" | head -1 || true)
            echo "--- probe: $name ${flag}"
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
              dotnet run --project src/MiVic.Game -c Release --no-build -- \
              $flag --probe "$p" --probe-out "artifacts/probe/$name.txt" || {
                echo "::error file=$p::probe $name failed"
                exit 1
              }
          done

      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-reports
          path: artifacts/probe/

      - name: Test
        run: dotnet test MiVic.sln -c Release --no-build --nologo
