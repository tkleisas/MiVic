# Every push and pull request: build the solution and run the tests.
#
# The effects compile with the project's own dotnet tool (ShadowDuskCLI — HLSL
# through DXC and SPIRV-Cross straight to GLSL, natives shipped for every desktop
# platform), so the build needs no Wine and no Windows SDK anywhere.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full, for git-describe versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build MiVic.sln -c Release

      - name: Install xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Probe smoke-test
        # Every probe in the repository, driven through a virtual display with
        # Mesa's software rasterizer — no GPU needed. A red probe is a red
        # build: the probes step the real world, render real frames and hold
        # their checks, so this is the client regression gate, not a census.
        #
        # The probe's own header names the client line it is written for, so the
        # flags are read from that line rather than guessed at with a pattern.
        # The old grep could not see --rivals, --seed or --editor, so two
        # probes were being run in a scenario their own comment did not ask for.
        #
        # objectives.probe and paperclip.probe are excluded: each one is a
        # demonstration of the mission validator's refusals, whose subject
        # mission is broken on purpose, so they exit non-zero by design on
        # every platform.
        run: |
          mkdir -p artifacts/probe
          for p in tools/probe/*.probe; do
            name=$(basename "$p" .probe)
            case "$name" in objectives|paperclip) continue ;; esac
            flags=$(line=$(grep -m1 -E '^#[[:space:]]*MiVic\.Game\.exe ' "$p" || true)
              flags=${line#*MiVic.Game.exe }
              flags=${flags%%--probe *}
              echo "$flags" | xargs)
            echo "--- probe: $name ${flags}"
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
              dotnet run --project src/MiVic.Game -c Release --no-build -- \
              $flags --probe "$p" --probe-out "artifacts/probe/$name.txt" || {
                echo "::error file=$p::probe $name failed"
                exit 1
              }
          done

      - name: Figure measurement
        # Twelve widths from crown to chin and one colour, against a baseline committed
        # as numbers. This renders the .glb and .png that are in the repository — no
        # Blender and no reference image — and fails the build if the figure has moved
        # away from where it measured.
        #
        # It exists because the same measurement was written from scratch about thirty
        # times while the figure was being built, each in a throwaway script, and three
        # of those were wrong in ways that looked like data: a crop that ran past the
        # chin so the neck was the widest row, a crop too narrow to hold the head so the
        # clipping set the maximum, and a background that would not flood out at all.
        # All three are checks in the tool now rather than care taken by whoever is
        # measuring, and each is a test the tool is expected to fail — the third is why
        # `capture` refuses the painted portrait as a reference.
        run: |
          python3 -m pip install --quiet --break-system-packages pillow \
            || python3 -m pip install --quiet pillow
          python3 tools/measure_figure.py check

      - name: Self-test
        # The self-test is the client's own verdict on Greek text, the symbol
        # atlas, the health bars, the replay round-trip and the frame budget.
        # It used to be absent from CI, and while it was absent it crashed on
        # Linux before printing the verdict and reported FAIL when it did not —
        # so the check the documentation leans on was never actually run in the
        # one place the documentation is read. It exits non-zero on FAIL.
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            dotnet run --project src/MiVic.Game -c Release --no-build -- --selftest 600

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: src/MiVic.Game/bin/Release/net9.0/selftest-report.txt

      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-reports
          path: artifacts/probe/

      - name: Test
        run: dotnet test MiVic.sln -c Release --no-build --nologo
